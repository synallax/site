            schema:
              type: object
              required: [plan, acceptTerms]
              properties:
                plan: { enum: [basic, premium] }
                acceptTerms: { type: boolean }
      responses:
        '200': { description: "{url} - the Stripe Checkout page." }
        '422': { $ref: '#/components/responses/Rejected' }
        '503': { description: BillingNotConfigured. }

