      responses:
        '200': { description: The instrument., content: { application/json: { schema: { $ref: '#/components/schemas/Instrument' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [instruments]
      operationId: withdrawInstrument
      summary: Withdraw an instrument
